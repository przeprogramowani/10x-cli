name: CI
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by SHA to prevent tag-swapping supply chain attacks.
      # To update: verify the new SHA on the action's releases page,
      # then update both the SHA and the version comment.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.12.1 --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun pm ls --all 2>&1 | head -200

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Validate packaged CLI helpers and shared references
        run: bun run validate:cli-skills

      - name: Test (unit + integration, excludes smoke)
        run: bun test tests/*.test.ts

      - name: Build (node target)
        run: bun run build

      - name: Build (binary)
        run: bun run build:binary

      - name: Smoke tests (binary + package)
        run: bun test tests/smoke/

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.12.1 --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (unit + integration, excludes smoke)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path tests -Filter *.test.ts | ForEach-Object { $_.FullName }
          bun test @files

      - name: Build (node target)
        run: bun run build

      - name: Build (binary)
        run: bun run build:binary

      - name: Smoke tests (binary + package)
        run: bun test tests/smoke/

  version-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile
      - name: Retain bootstrap calculation (read-only, revalidated after human merge)
        run: node scripts/prepare-version.mjs --bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_RECORD_DIR: ${{ runner.temp }}/version-records
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: version-preparation-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/version-records/${{ github.event.pull_request.number }}/version-preparation.json
          if-no-files-found: warn
          retention-days: 90

  # Publication rides the same run and Checks view as the tests that cleared it.
  # `permissions` is declared here because a called workflow can only narrow the
  # caller's token, and this workflow's default is read-only.
  release:
    needs: [check, check-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      cli_sha: ${{ github.sha }}
    secrets: inherit

  # `release` is a called workflow, so the caller sees one result for the whole
  # thing. Its gate outputs are what distinguish "published" from "the version
  # was already taken", which is the ordinary shape of a master push with no
  # version bump.
  notify-slack:
    needs: [check, check-windows, release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build notification payload
        id: payload
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s\n' "$COMMIT_MESSAGE" | head -1 | cut -c1-80)
          echo "commit_msg=${MSG}" >> "$GITHUB_OUTPUT"
          if [[ "${{ needs.check.result }}" != "success" || "${{ needs.check-windows.result }}" != "success" || "${{ needs.release.result }}" == "failure" || "${{ needs.release.result }}" == "cancelled" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to #observability
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.payload.outputs.failed == 'true' && '🔴' || needs.release.outputs.proceed == 'true' && '📦' || '🟢' }} 10x-cli pipeline",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.payload.outputs.failed == 'true' && '🔴' || needs.release.outputs.proceed == 'true' && '📦' || '🟢' }} 10x-cli${{ needs.release.outputs.proceed == 'true' && format(' — v{0}', needs.release.outputs.version) || '' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.check.result == 'success' && needs.check-windows.result == 'success' && '✅' || '❌' }} Tests (Linux/Windows)    ${{ needs.release.result == 'failure' && '❌' || needs.release.outputs.proceed == 'true' && '✅' || '⏭️' }} npm + release${{ needs.release.outputs.reason != '' && needs.release.outputs.proceed != 'true' && format(' ({0})', needs.release.outputs.reason) || '' }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "📝 <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`> ${{ steps.payload.outputs.commit_msg }}  ·  👤 ${{ github.actor }}  ·  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 Workflow>${{ steps.payload.outputs.failed == 'true' && '  ·  🔔 see #alerting' || '' }}"
                    }
                  ]
                }
              ]
            }

      - name: Post to #alerting
        if: steps.payload.outputs.failed == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 10x-cli pipeline failure",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 10x-cli — FAILURE"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Tests (Linux/Windows)*\n${{ needs.check.result == 'success' && needs.check-windows.result == 'success' && '✅ passed' || '❌ failed' }}" },
                    { "type": "mrkdwn", "text": "*npm + release*\n${{ needs.release.result == 'failure' && '❌ failed' || needs.release.outputs.proceed == 'true' && format('✅ v{0}', needs.release.outputs.version) || format('⏭️ {0}', needs.release.outputs.reason) }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📝 *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\n${{ steps.payload.outputs.commit_msg }}\n\n👤 *Author:* ${{ github.actor }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🔍 <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|Commit diff>  ·  📜 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Full logs>  ·  📦 <https://www.npmjs.com/package/@przeprogramowani/10x-cli|npm package>"
                    }
                  ]
                }
              ]
            }
