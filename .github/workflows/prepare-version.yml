name: Prepare CLI version
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [master]
  push:
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
permissions:
  contents: read
  pull-requests: read
jobs:
  select:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - uses: actions/github-script@v7
        id: select
        with:
          script: |
            const prs = context.payload.pull_request ? [context.payload.pull_request] : await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'master', per_page: 100 });
            if (prs.length > 100) throw new Error('Bounded PR reconciliation required');
            core.setOutput('prs', JSON.stringify(prs.filter(pr => pr.head.repo?.full_name === process.env.GITHUB_REPOSITORY).map(pr => pr.number)));
  # `select` drops fork PRs on purpose: RELEASE_TOKEN must not write to a
  # repository we do not own. Without this job the only trace is a skipped
  # `prepare` check, and a fork PR merges with no version bump (PR #66).
  # Reads event metadata only; never checks out or runs PR code.
  fork-notice:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const label = 'needs-release-prep';
            const marker = '<!-- 10x-cli:needs-release-prep -->';
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Fork PR: version preparation cannot run; see the bot comment' });
            } catch (error) {
              if (error.status !== 422) throw error; // 422: the label already exists
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [label] });
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            if (comments.some((comment) => comment.body?.includes(marker))) return;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body: [
              marker,
              '**Version preparation cannot run on this PR.** It comes from a fork, and the release bot only writes `chore(release): prepare vX.Y.Z` to branches in this repository.',
              '',
              'Merged as is, this change lands on `master` without a version bump and is not published to npm until a later PR bumps the version.',
              '',
              'Maintainers, to release it with its own version:',
              '1. `gh pr checkout ' + issue_number + '` and push the branch to this repository (`git push origin HEAD:<branch>`); commit authorship is kept.',
              '2. Open a PR from that branch; `Prepare CLI version` adds the bump there.',
              '3. Close this PR with a link to the new one.',
            ].join('\n') });
  prepare:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    name: Prepare version (#${{ matrix.pr }})
    needs: select
    if: needs.select.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    concurrency:
      group: prepare-version-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses the trusted base SHA. Never checkout PR code here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Calculate and conditionally update the same PR using Git objects only
        run: node scripts/prepare-version.mjs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION_ACTIONS_READ_TOKEN: ${{ github.token }}
          VERSION_PR_NUMBER: ${{ matrix.pr }}
          VERSION_RECORD_DIR: ${{ runner.temp }}/version-records
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: version-preparation-${{ matrix.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/version-records/${{ matrix.pr }}/version-preparation.json
          if-no-files-found: warn
          retention-days: 90
