name: Refresh Repo Map

# Regenerates the committed context map (context/map/*) from git history + the
# import graph and opens a PR when it drifts — zero LLM cost, so every agent and
# developer query reuses fresh context. See tools/repo-map/ and .claude/skills/.
# Actions pinned by SHA (repo convention); PR created with the runner's gh CLI
# to avoid adding a third-party action to the supply chain.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-map-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA to prevent tag-swapping supply chain attacks (same pins as ci.yml).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # full history — the territory scan reads git log

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate repo map
        run: bun run repo-map

      - name: Open refresh PR if the map drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- context/map; then
            echo "Repo map unchanged — no PR."
            exit 0
          fi
          BRANCH="refresh-repo-map-$(date +'%Y%m%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add context/map
          git commit -m "chore(repo-map): scheduled refresh of context/map"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Repo map — scheduled refresh" \
            --body "Automated refresh of \`context/map/\` by \`bun run repo-map\`. Opened only because the committed map drifted from the code. Review for shifts in active areas, cycles, or risk zones." \
            --label automation || gh pr create \
            --title "Repo map — scheduled refresh" \
            --body "Automated refresh of \`context/map/\` by \`bun run repo-map\`."
